name: 更新股價資料

on:
  schedule:
    - cron: "30 10 * * 1-5"   # 週一到週五 台灣時間 18:30
  workflow_dispatch:           # 也可以在 Actions 分頁手動執行

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install requests pandas lxml cryptography

      - name: 讀取歷史股價快取
        uses: actions/cache/restore@v4
        with:
          path: prices_cache.json
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: 抓資料
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: python fetch_data.py

      - name: 儲存歷史股價快取
        if: always()
        uses: actions/cache/save@v4
        with:
          path: prices_cache.json
          key: prices-${{ github.run_id }}

      - name: 存檔
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "更新資料 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase
          git push
